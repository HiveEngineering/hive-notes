<html lang="en">
<head>

<title>Hive-Notes</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* VOICE: plain, calm field tool — a safety form that is quick to fill on a phone and complete on a PC
   IDEA: the paper Health & Safety Plan, rebuilt as a two-page clipboard with a sign-off at the foot of each page
   PICTURE: the hazard table itself, with risk codes coloured by the Hive risk matrix
   COLOUR and TYPE: Hive main blue #00ADEF bands with navy text, light blue #E5F8FF zones, green/yellow/red risk chips; Figtree
   LAYOUT: top bar, page content up to 1240px, cards on phones, table rows on PC */
:root{color-scheme:light dark;
--blue:#00ADEF;--navy:#0F2A36;--link:light-dark(#00729E,#5cc8f2);--light:light-dark(#E5F8FF,#0f2a36);
--green:#C2D64A;--yellow:#FFDF00;--grey:#58595B;
--bg:light-dark(#f6f9fb,#0b1820);--card:light-dark(#fff,#11232d);--ink:light-dark(#14232b,#e6f0f4);--muted:light-dark(#5b6b73,#9fb3bc);
--line:light-dark(#d5e2e8,#24414f);--field:light-dark(#fff,#0c1c24);
--ext:#C62828;--high:#F57C00;--med:#FFDF00;--low:#C2D64A}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:var(--navy);padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;min-height:56px;box-shadow:0 1px 0 #0003}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;background:none;border:0;padding:4px;cursor:pointer;color:var(--navy)}
.top .brand svg,.top .brand img{height:32px;width:auto}
.top .sp{flex:1}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:#ffffffcc;color:var(--navy);white-space:nowrap}
.badge.off{background:var(--yellow)}
.iconbtn{min-width:44px;min-height:44px;border:0;border-radius:10px;background:#ffffff55;color:var(--navy);font-weight:700;cursor:pointer;padding:0 10px}
.iconbtn:hover{background:#ffffff88}
main{max-width:1240px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-left)) 80px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.1;margin:8px 0 6px;text-wrap:balance}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:17px;margin:16px 0 6px}
p.lead{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.band{background:var(--light);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px 18px}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted)}
label.f>span.req{color:var(--ext)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px;margin-top:4px}
textarea{resize:vertical;min-height:70px;line-height:1.4}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
input:disabled,textarea:disabled,select:disabled{opacity:.85;background:transparent}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--navy)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.go{background:var(--green);border-color:var(--green);color:var(--navy)}
.btn.warn{color:var(--ext)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--light);color:var(--ink);white-space:nowrap}
.chip.draft{background:#e0e6ea;color:#33434b}.chip.submitted{background:var(--blue);color:var(--navy)}.chip.queued{background:var(--yellow);color:var(--navy)}.chip.reviewed{background:var(--green);color:var(--navy)}
.risk{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:84px;min-height:40px;padding:4px 10px;border-radius:9px;border:1px dashed var(--line);font-weight:700;cursor:pointer;background:var(--field);color:var(--ink);white-space:nowrap}
.risk.Ext{background:var(--ext);color:#fff;border-color:var(--ext)}
.risk.High{background:var(--high);color:var(--navy);border-color:var(--high)}
.risk.Med{background:var(--med);color:var(--navy);border-color:var(--med)}
.risk.Low{background:var(--low);color:var(--navy);border-color:var(--low)}
.risk small{font-weight:600;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin:14px 0}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;min-height:140px}
.tile:hover{border-color:var(--blue)}
.tile b{font-size:19px}.tile .ic{width:46px;height:46px;border-radius:12px;background:var(--light);display:grid;place-items:center}
.tile.soon{cursor:default;opacity:.65}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
@media(max-width:600px){.secs{grid-template-columns:1fr}}
.tile.sec{min-height:170px;border-top:6px solid var(--blue)}
.tile.sec b{font-size:22px}
.tile.sec[data-sec=safety]{border-top-color:var(--green)}
.tile.sec.soon{border-top-color:var(--line)}
.tile .chip{align-self:flex-start}
.tile.soon:hover{border-color:var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;padding-bottom:2px}
.tab{flex:none;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme=dark] .tab.on{background:var(--blue);color:var(--navy)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.item:hover{border-color:var(--blue)}
.item .t{font-weight:700}.item .grow{flex:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* hazard rows */
.hz-head{display:none}
.hz{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;display:grid;gap:10px;grid-template-columns:1fr}
.hz .num{font-weight:700;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center}
.hz .rk{display:flex;gap:16px;flex-wrap:wrap}
.hz .rk>div{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.hz input.task{font-size:14px;min-height:36px;padding:6px 10px;margin-top:6px;color:var(--muted)}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.docs a,.docs span{font-size:13px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--light);text-decoration:none}
.docs span{color:var(--muted)}
@media(min-width:960px){
 .hz-head{display:grid;grid-template-columns:34px 1.1fr 1.6fr .8fr 104px 1.7fr 104px 44px;gap:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
 .hz{grid-template-columns:34px 1.1fr 1.6fr .8fr 104px 1.7fr 104px 44px;gap:8px;padding:8px 10px;margin:6px 0;align-items:start;border-radius:10px}
 .hz .num{flex-direction:column;gap:4px}
 .hz label.f>.lbl{display:none}
 .hz .rk{display:contents}
 .hz .rk>div>.lbl{display:none}
 .hz .more{grid-column:2/-1}
}
/* modal */
.scrim{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:20px}}
.modal{background:var(--card);color:var(--ink);width:100%;max-width:980px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{border-radius:18px}}
.modal.narrow{max-width:520px}
.modal h2{margin-top:0}
.mhead{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--card);padding:6px 0 10px;z-index:2}
.mhead h2{flex:1;margin:0}
.pick{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.pick{grid-template-columns:1fr 1fr}}
.pick h3{display:flex;align-items:center;gap:8px}
.pick .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{min-height:56px;border-radius:10px;border:2px solid transparent;padding:8px 10px;font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;text-align:left;color:#fff}
.opt.act{background:#0a3d8f}.opt.haz{background:#1f6b2a}
.opt.sel{border-color:var(--yellow);box-shadow:0 0 0 2px var(--navy) inset}
.opt.used{opacity:.55}
.matrix{display:grid;grid-template-columns:minmax(78px,1.5fr) repeat(5,minmax(44px,1fr));gap:4px;font-size:13px}
.matrix .h{line-height:1.2}.matrix .risk{min-width:0;padding:4px 2px;flex-direction:column;gap:0;line-height:1.1}
@media(max-width:600px){.matrix{font-size:12px}.matrix .h{padding:4px 1px;font-size:10.5px;overflow-wrap:anywhere}}
.matrix .h{font-weight:700;padding:6px;color:var(--muted)}
.matrix button{min-height:52px;border:0;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
.matrix button.cur{outline:3px solid var(--navy);outline-offset:-3px}
/* signature */
.sign{border:2px solid var(--navy);border-radius:14px;padding:14px;margin:22px 0 8px;background:var(--card)}
:root[data-theme=dark] .sign{border-color:var(--blue)}
.sign h3{margin:0 0 4px}
.pad{position:relative;width:100%;height:170px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;margin-top:8px;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.pad .line{position:absolute;left:16px;right:16px;bottom:38px;border-bottom:1px solid #9aa;pointer-events:none}
.pad .hint{position:absolute;left:16px;bottom:12px;font-size:13px;color:#789;pointer-events:none}
.signed img{max-height:110px;background:#fff;border-radius:8px;border:1px solid var(--line);padding:4px;max-width:100%}
/* tables (PC editors) */
.scroll{overflow-x:auto}
table.ed{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.ed.lib{min-width:1280px}
table.ed th{position:sticky;top:0;background:var(--light);text-align:left;padding:8px;font-size:13px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
table.ed td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ed td input,table.ed td select,table.ed td textarea{margin:0;font-size:14px;min-height:38px;padding:6px 8px}
table.ed td textarea{min-height:60px}
.tblwrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;position:sticky;top:56px;z-index:5;background:var(--bg);padding:8px 0}
.toolbar input[type=search]{max-width:280px;margin:0}
.toolbar select{width:auto;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:80;max-width:92vw;box-shadow:0 6px 20px #0005}
.steps{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.steps button{flex:1 0 auto;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;padding:6px 12px;color:var(--ink)}
.steps button.on{background:var(--blue);color:var(--navy);border-color:var(--blue)}
.steps button .ok{color:#3c7d16}
.check li{margin:4px 0}.check .no{color:var(--ext)}.check .yes{color:#3c7d16}
.note{font-size:14px;color:var(--muted);white-space:pre-wrap}
.callout{border-left:4px solid var(--ext);padding:8px 12px;background:light-dark(#fff4f4,#2a1416);border-radius:8px;font-weight:700;color:light-dark(#9b1c1c,#ffb4b4)}
.login{max-width:420px;margin:7vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.login .logo{display:flex;justify-content:center;margin-bottom:10px}
.login .logo svg,.login .logo img{height:64px;width:auto}
.err{color:var(--ext);font-weight:600;font-size:14px}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);margin-top:16px;z-index:4}
details>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
@media(max-width:600px){main{padding-top:10px}.top .brand span{display:none}.hide-sm{display:none!important}}
@media(prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
@media print{.top,.sticky-actions,.toolbar{display:none}}
</style>

const MATRIX = {'1A':'Ext','1B':'Ext','1C':'Ext','1D':'Ext','1E':'High','2A':'Ext','2B':'Ext','2C':'Ext','2D':'High','2E':'High','3A':'Ext','3B':'High','3C':'High','3D':'Med','3E':'Med','4A':'High','4B':'High','4C':'Med','4D':'Low','4E':'Low'};

function matrixHtml(cur) {
  return `<div class="matrix"><div class="h">Severity ↓<br>Likelihood →</div>${'ABCDE'.split('').map(p => `<div class="h" title="${esc(PROB[p])}">${p}<br>${PROB[p].split(' –')[0]}</div>`).join('')}

}
const LEVEL_NAME = {Ext:'Extreme', High:'High', Med:'Medium', Low:'Low'};
const normCode = c => { c = String(c || '').replace(/\s/g,'').toUpperCase(); return MATRIX[c] ? c : ''; };
const levelOf = c => MATRIX[normCode(c)] || '';
const riskBtn = (code, attrs) => { const c = normCode(code), l = levelOf(c); return `<button type="button" class="risk ${l}" ${attrs}>${c ? esc(c) + ' <small>' + LEVEL_NAME[l] + '</small>' : 'Pick…'}</button>`; };

/* ---------- SOP / SWP references in control measures ---------- */
const DOC_RE = /\b(SWP|SJP|SOP)\b\s*:?\s*((?:\d+\s*[.,]\s*\d+(?:\s*(?:,|;|and|&)\s*(?=\d))?\s*)+)/gi;
function docCodes(text) {
  const out = [];

  return out;
}
const docMap = () => Object.fromEntries((S.cfg.register || []).map(d => [d.code, d]));

function defaultRegister(library, templates) {

function docSort(a, b) { const pa = a.code.split(' '), pb = b.code.split(' '); if (pa[0] !== pb[0]) return pa[0] < pb[0] ? -1 : 1; const na = pa[1].split('.').map(Number), nb = pb[1].split('.').map(Number); return (na[0]-nb[0]) || (na[1]-nb[1]); }

  async get(k) { if (!this.db) return this.mem[k]; return new Promise(res => { try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(this.mem[k]); } }); },
  async set(k, v) { if (!this.db) { this.mem[k] = v; return; } return new Promise(res => { try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { this.mem[k] = v; res(); } }); }
};

  async profile(user) { const {data, error} = await this.sb.from('hn_staff').select('*').eq('id', user.id).maybeSingle(); if (error) throw error; return data || {id: user.id, email: user.email, noProfile: true}; },
  async emailFor(u) { u = u.trim(); if (u.includes('@')) return u; const {data, error} = await this.sb.rpc('hn_login_email', {p_username: u}); if (error) throw error; if (!data) throw new Error('User name not found or not active.'); return data; },
  async signIn(u, p) { const email = await this.emailFor(u); const {data, error} = await this.sb.auth.signInWithPassword({email, password: p}); if (error) throw new Error(error.message === 'Invalid login credentials' ? 'User name or password is not right.' : error.message); const me = await this.profile(data.user); if (!me.noProfile) { await DB.set('live:me:' + me.id, me); LS.set('lastUid', me.id); this.sb.rpc('hn_touch').then(() => {}, () => {}); } return me; },
  async signOut() { LS.set('lastUid', ''); await this.sb.auth.signOut(); },
  async setPassword(pw) { const {error} = await this.sb.auth.updateUser({password: pw}); if (error) throw error; },
  async reset(u) { const email = await this.emailFor(u); const {error} = await this.sb.auth.resetPasswordForEmail(email, {redirectTo: appUrl()}); if (error) throw error; },
  async claimFirst(username, name) { const {error} = await this.sb.rpc('hn_claim_first_admin', {p_username: username, p_full_name: name}); if (error) throw error; },
  async pull() {
    const [st, cf, nt] = await Promise.all([
      this.sb.from('hn_staff').select('*').order('full_name'),
      this.sb.from('hn_config').select('key,data,updated_at'),
      this.sb.from('hn_notes').select('*').order('updated_at', {ascending: false}).limit(1000)
    ]);
    if (st.error) throw st.error; if (cf.error) throw cf.error; if (nt.error) throw nt.error;
    S.staff = st.data; await DB.set('live:staff', S.staff);
    if (cf.data.length) { cf.data.forEach(r => { S.cfg[r.key] = r.data; }); await DB.set('live:cfg', S.cfg); }
    else if (isAdmin()) { for (const k of Object.keys(S.cfg)) await this.saveConfig(k, S.cfg[k]); }
    const seen = new Set();
    nt.data.forEach(r => { seen.add(r.id); const l = S.notes[r.id];
      if (!l) S.notes[r.id] = r;
      else if ((!l._dirty && !l._queued && !l._deleted) || new Date(r.updated_at) > new Date(l.updated_at)) { Object.keys(l).forEach(k => delete l[k]); Object.assign(l, r); } // in place: the open editor keeps the same object
    });
    Object.values(S.notes).forEach(n => { if (!seen.has(n.id) && !n._dirty && !n._queued && !n._local) delete S.notes[n.id]; });
    await saveNotes();
  },
  row(n) { return {id: n.id, section: n.section, kind: n.kind, owner: n.owner, pm: n.pm || null, status: n.status, title: n.title, project_no: n.project_no, data: n.data, pdf_path: n.pdf_path || null, submitted_at: n.submitted_at || null, reviewed_at: n.reviewed_at || null, reviewed_by: n.reviewed_by || null, created_at: n.created_at, updated_at: n.updated_at}; },
  async write(n) { // insert new rows, update existing ones (an upsert would fire the insert trigger on existing rows)
    const row = this.row(n);
    let r = n._local ? await this.sb.from('hn_notes').insert(row) : await this.sb.from('hn_notes').update(row).eq('id', n.id);
    if (r.error && n._local && r.error.code === '23505') r = await this.sb.from('hn_notes').update(row).eq('id', n.id);
    if (r.error) throw r.error;
    n._local = false;
  },
  async push() {
    for (const n of Object.values(S.notes)) {
      if (n._deleted) { const {error} = await this.sb.from('hn_notes').delete().eq('id', n.id); if (!error || error.code === 'PGRST116') delete S.notes[n.id]; continue; }
      if (!n._dirty || n._queued) continue;
      const stamp = n.updated_at; await this.write(n); if (n.updated_at === stamp) n._dirty = false; // edits made during the upload stay dirty
    }
    for (const item of S.outbox.slice()) {
      const n = S.notes[item.id]; if (!n) { S.outbox = S.outbox.filter(o => o !== item); continue; }
      const path = n.owner + '/' + n.id + '.pdf';
      const up = await this.sb.storage.from('hn-pdfs').upload(path, item.pdf, {upsert: true, contentType: 'application/pdf'}); if (up.error) throw up.error;
      n.pdf_path = path;
      await this.write(n);
      const r = await this.sb.functions.invoke('hn-submit', {body: {note_id: n.id}});
      if (r.error) { let msg = r.error.message; try { msg = (await r.error.context.json()).error || msg; } catch (e) {} n.email_error = msg; throw new Error('Saved, but the email did not send: ' + msg); }
      n._queued = false; n._dirty = false; n._local = false; n.emailed_at = r.data.emailed_at; n.email_error = null;
      S.outbox = S.outbox.filter(o => o !== item);
    }
    await saveNotes(); await DB.set(key('outbox'), S.outbox);
  },
  async saveConfig(k, data) { S.cfg[k] = data; await DB.set('live:cfg', S.cfg); const {error} = await this.sb.from('hn_config').upsert({key: k, data, updated_at: new Date().toISOString(), updated_by: S.me.id}); if (error) throw error; },
  async invite(st) { const r = await this.sb.functions.invoke('hn-admin', {body: {action: 'invite', staff: st, app_url: appUrl()}}); if (r.error) throw await fnErr(r.error); return r.data; },
  async adminAction(action, payload) { const r = await this.sb.functions.invoke('hn-admin', {body: {action, ...payload, app_url: appUrl()}}); if (r.error) throw await fnErr(r.error); return r.data; },
  async updateStaff(st) { const {error} = await this.sb.from('hn_staff').update({full_name: st.full_name, username: st.username, role: st.role, is_pm: st.is_pm, title: st.title || null, phone: st.phone || null}).eq('id', st.id); if (error) throw error; const i = S.staff.findIndex(x => x.id === st.id); S.staff[i] = st; await DB.set('live:staff', S.staff); },
  async pdf(n) { const {data, error} = await this.sb.storage.from('hn-pdfs').download(n.pdf_path); if (error) throw error; return data; }
};
async function fnErr(e) { try { const j = await e.context.json(); return new Error(j.error || e.message); } catch (x) { return e; } }
const B = () => S.mode === 'demo' ? Demo : Live;
const appUrl = () => S.conf.appUrl || (location.origin + location.pathname);
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }

async function saveNotes() { await DB.set(key('notes'), S.notes); }
let syncTimer = null;
function queueSync(ms = 1500) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync(manual) {
  if (S.mode === 'demo' || !S.me || S.me.noProfile) return;
  if (!S.online) { if (manual) toast('Offline – changes are kept on this device and will sync when you are back online.'); return; }
  if (S.syncing) return; S.syncing = true; topbar();
  try { await Live.push(); await Live.pull(); S.lastSync = new Date().toISOString(); LS.set('lastSync', S.lastSync); if (manual) toast('Synced'); }
  catch (e) { console.warn(e); toast(e.message || String(e)); }
  finally { S.syncing = false; topbar(); if (['list','home'].includes(S.view) || (S.view === 'plan' && (!S.notes[S.param] || P !== S.notes[S.param] || !canEdit(S.notes[S.param])))) { const y = scrollY; render(); scrollTo(0, y); } }
}

/* ---------- UI helpers ---------- */
function toast(msg, ms = 3500) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function modal(html, cls = '') { const l = $('#layer'); l.innerHTML = `<div class="scrim" data-close-scrim><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`; const first = $('.modal input,.modal select,.modal textarea,.modal button', l); if (first && WIDE()) first.focus(); return $('.modal', l); }
function closeModal() { $('#layer').innerHTML = ''; }
function ask(title, msg, okText = 'OK', danger) { return new Promise(res => { const m = modal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="no">Cancel</button><button class="btn ${danger ? 'warn' : 'pri'}" data-a="yes">${esc(okText)}</button></div>`, 'narrow'); m.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (a) { closeModal(); res(a.dataset.a === 'yes'); } }); }); }
async function saveFile(blob, filename) {
  try { if (window.claude && window.claude.use) { const d = await window.claude.use('downloads'); if (d) { await d.save({filename, data: blob}); return; } } } catch (e) { console.warn(e); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}

async function submitPlan() {
  const pr = problems(P); if (pr.length) { toast('Fill in the missing items first.'); return; }
  const pm = staffById(P.pm);
  if (!await ask('Submit safety plan?', `The plan will be emailed to ${pm.full_name} (${pm.email}) as a PDF, with a copy to you. You won’t be able to edit it unless you reopen it.`, 'Submit')) return;
  P.status = 'submitted'; P.submitted_at = new Date().toISOString(); P.data.submittedBy = S.me.id; P.email_error = null; touch();
  const blob = await buildPdf(P);
  if (S.mode === 'demo') { P._dirty = false; await saveNotes(); render(); emailPreview(P, blob); return; }
  P._queued = true; S.outbox = S.outbox.filter(o => o.id !== P.id); S.outbox.push({id: P.id, pdf: blob});
  await DB.set(key('outbox'), S.outbox); await saveNotes(); render();
  if (S.online) { toast('Sending…'); await sync(); const n = S.notes[P.id]; toast(n && !n._queued ? 'Submitted and emailed to ' + pm.full_name : (S.online ? 'Saved. It will retry sending.' : 'Saved on this device – it will send when you are online.'), 5000); render(); }
  else toast('You are offline. The plan is saved and will send itself when you are back online.', 5000);
}

    case 'docsave': { const bad = REG.filter(r => r.url && !/^https:\/\//i.test(r.url)); if (bad.length) { toast(`Links must start with https:// (${bad.map(b => b.code).join(', ')})`); break; } REG = REG.filter(r => r.code.trim()).map(r => ({...r, code: r.code.trim().replace(/\s+/g, ' ')})); REG.sort(docSort); try { await saveCfg('register', REG); toast('Saved'); viewDocs($('#app')); } catch (x) {} break; }
    // templates
    case 'tnew': { const name = await promptText('New template', 'Template name', ''); if (!name) break; const t = {id: 'T' + uid().slice(0, 8), name, rows: []}; TPL.push(t); go('templates', t.id, true); break; }
    case 'tren': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; const name = await promptText('Rename template', 'Template name', cur.name); if (name) { cur.name = name; viewTemplates($('#app')); } break; }
    case 'tdel': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; if (await ask('Delete template?', `Delete “${cur.name}”? (Takes effect when you save.)`, 'Delete', 1)) { TPL = TPL.filter(t => t !== cur); go('templates', TPL[0] && TPL[0].id, true); } break; }
    case 'trowadd': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; cur.rows.push({name: '', task: '', desc: '', resp: 'Employee', risk: '', control: '', residual: ''}); viewTemplates($('#app')); break; }
    case 'trowdel': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; cur.rows.splice(i, 1); viewTemplates($('#app')); break; }
    case 'trisk': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; pickCode(normCode(cur.rows[i][a.dataset.k]), a.dataset.k === 'risk' ? 'Risk level' : 'Residual risk', c => { cur.rows[i][a.dataset.k] = c; viewTemplates($('#app')); }); break; }
    case 'tsave': try { await saveCfg('templates', TPL); toast('Templates saved'); viewTemplates($('#app')); } catch (x) {} break;
    // emergency
    case 'emadd': EM.communities.push({id: 'C' + uid().slice(0, 8), city: '', prov: 'NS', v: {}}); viewEmergency($('#app')); break;
    case 'emdel': if (await ask('Delete community?', `Delete ${EM.communities[i].city || 'this row'}?`, 'Delete', 1)) { EM.communities.splice(i, 1); viewEmergency($('#app')); $('[data-act=emsave]').disabled = false; } break;
    case 'emsave': try { await saveCfg('emergency', EM); toast('Saved'); viewEmergency($('#app')); } catch (x) {} break;
    case 'txreset': if (await ask('Restore wording?', 'Put back the original wording from the Excel form (with EXP changed to Hive)?', 'Restore')) { try { await saveCfg('texts', {...DEFAULT_TEXTS}); render(); } catch (x) {} } break;
    // staff
    case 'addstaff': staffForm(); break;
    case 'editstaff': staffForm(staffById(a.dataset.id)); break;
    case 'reinvite': { const s = staffById(a.dataset.id); try { await B().adminAction('resend', {id: s.id}); S.mode === 'demo' ? inviteInfo(s) : toast('Invitation sent again to ' + s.email); } catch (x) { toast(x.message); } break; }
    case 'toggleactive': { const s = staffById(a.dataset.id); const on = s.active === false; if (!await ask(on ? 'Reactivate?' : 'Deactivate?', on ? `${s.full_name} will be able to sign in again.` : `${s.full_name} won’t be able to sign in. Their plans stay.`, on ? 'Reactivate' : 'Deactivate', !on)) break; try { await B().adminAction('set_active', {id: s.id, active: on}); s.active = on; if (S.mode === 'demo') await Demo.saveStaff(S.staff); else await Live.pull(); render(); } catch (x) { toast(x.message); } break; }
  }
});
function promptText(title, label, val) { return new Promise(res => { const m = modal(`<h2>${esc(title)}</h2><form id="pt"><label class="f">${esc(label)}<input type="text" id="ptv" value="${esc(val || '')}" required></label><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" data-x>Cancel</button><button class="btn pri">OK</button></div></form>`, 'narrow'); $('#ptv', m).focus(); m.addEventListener('click', e => { if (e.target.closest('[data-x]')) { closeModal(); res(null); } }); $('#pt', m).onsubmit = e => { e.preventDefault(); const v = $('#ptv', m).value.trim(); closeModal(); res(v); }; }); }

const VIEWS = {home: viewHome, list: viewList, plan: viewPlan, library: viewLibrary, docs: viewDocs, templates: viewTemplates, emergency: viewEmergency, admin: viewAdmin, texts: viewTexts};

/* ---------- demo sample ---------- */
function seedDemoNotes() {
  const lib = n => { const x = S.cfg.library.find(l => l.name === n); return {libId: x.id, name: x.name, desc: x.desc, resp: x.resp, risk: x.risk, control: x.control, residual: x.residual, task: '', due: '', done: ''}; };
  const c = S.cfg.emergency.communities.find(x => x.city === 'Sydney') || S.cfg.emergency.communities[0];
  const base = (id, owner, pm, status, title, no, addr, rows, extra = {}) => { const now = new Date(Date.now() - Math.random() * 6e8).toISOString(); S.notes[id] = Object.assign({id, section: 'safety', kind: 'hazard_assessment', owner, pm, status, title, project_no: no, created_at: now, updated_at: now,
    data: {title, projectNo: no, date: now.slice(0, 10), address: addr, activities: 'Phase I ESA site visit', subActivities: 'None', subOwn: false, subHive: false, community: c.id, emergency: {...c.v}, contacts: {client: 'NSTIR', fieldRep: (staffById(owner) || {}).full_name, safety: '', gc: '', sub: '', subcon: '', other: ''}, rows, violence: false, crew: [], sign1: null, sign2: null, template: ''}}, extra); };
  base('demo-1', 'd-tech', 'd-admin', 'draft', 'Phase I ESA', '26-0142', '60 Main Street, Reserve Mines, NS', ['Working Alone', 'Traffic', 'Mobile Equipment', 'Ticks', 'Hazardous Materials'].map(lib));
  base('demo-2', 'd-tech2', 'd-admin', 'submitted', 'Geotechnical investigation – Kings Road', '26-0131', '480 Kings Road, Sydney River, NS', ['Test Pit Investigation', 'Underground Utility Locates', 'Traffic', 'Drilling Boreholes'].map(lib), {submitted_at: new Date(Date.now() - 864e5).toISOString()});
  S.notes['demo-2'].data.sign1 = S.notes['demo-2'].data.sign2 = {name: 'Amélie Boudreau', sig: null, at: new Date(Date.now() - 864e5).toISOString()};
  saveNotes();
}

/* ---------- start ---------- */
async function start() {
  addEventListener('online', () => { S.online = true; topbar(); sync(); });
  addEventListener('offline', () => { S.online = false; topbar(); });
  if (/type=(invite|recovery)/.test(location.hash)) S.needPassword = true;
  await DB.open();
  try { const r = await fetch('logo.png', {cache: 'no-cache'}); if (r.ok && (r.headers.get('content-type') || '').startsWith('image')) { const b = await r.blob(); LOGO_IMG = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); }); } } catch (e) {}
  try { const r = await fetch('hivenotes-config.json', {cache: 'no-cache'}); if (r.ok) S.conf = await r.json(); else S.conf = JSON.parse(LS.get('conf') || '{}'); if (r.ok) LS.set('conf', JSON.stringify(S.conf)); } catch (e) { try { S.conf = JSON.parse(LS.get('conf') || '{}'); } catch (x) { S.conf = {}; } }
  S.mode = S.conf.supabaseUrl && S.conf.supabaseKey ? 'live' : 'demo';
  S.lastSync = LS.get('lastSync');
  try { await B().init(); S.me = await B().restore(); } catch (e) { console.warn(e); S.me = null; }
  if (S.mode === 'demo' && !LS.get('demoUser')) S.me = null;
  if (S.me) await afterLogin(); else render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.__noSW) {
    try { const reg = await navigator.serviceWorker.register('sw.js'); navigator.serviceWorker.addEventListener('controllerchange', () => { if (!window.__reloading) { window.__reloading = true; location.reload(); } }); reg.update(); } catch (e) {}
  }
  setInterval(() => { if (S.online && S.mode === 'live' && S.me) sync(); }, 5 * 60 * 1000);
}
start();
}
