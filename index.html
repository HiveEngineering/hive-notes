<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00ADEF">
<title>Hive-Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hive-Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: plain, calm field tool — a safety form that is quick to fill on a phone and complete on a PC
   IDEA: the paper Health & Safety Plan, rebuilt as a two-page clipboard with a sign-off at the foot of each page
   PICTURE: the hazard table itself, with risk codes coloured by the Hive risk matrix
   COLOUR and TYPE: Hive main blue #00ADEF bands with navy text, light blue #E5F8FF zones, green/yellow/red risk chips; Figtree
   LAYOUT: top bar, page content up to 1240px, cards on phones, table rows on PC */
:root{color-scheme:light dark;
--blue:#00ADEF;--navy:#0F2A36;--link:light-dark(#00729E,#5cc8f2);--light:light-dark(#E5F8FF,#0f2a36);
--green:#C2D64A;--yellow:#FFDF00;--grey:#58595B;
--bg:light-dark(#f6f9fb,#0b1820);--card:light-dark(#fff,#11232d);--ink:light-dark(#14232b,#e6f0f4);--muted:light-dark(#5b6b73,#9fb3bc);
--line:light-dark(#d5e2e8,#24414f);--field:light-dark(#fff,#0c1c24);
--ext:#C62828;--high:#F57C00;--med:#FFDF00;--low:#C2D64A}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:var(--navy);padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;min-height:56px;box-shadow:0 1px 0 #0003}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;background:none;border:0;padding:4px;cursor:pointer;color:var(--navy)}
.top .brand svg,.top .brand img{height:32px;width:auto}
.top .sp{flex:1}
.top .ver{font-size:12px;font-weight:600;color:var(--navy);opacity:.75;white-space:nowrap}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:#ffffffcc;color:var(--navy);white-space:nowrap}
.badge.off{background:var(--yellow)}
.iconbtn{min-width:44px;min-height:44px;border:0;border-radius:10px;background:#ffffff55;color:var(--navy);font-weight:700;cursor:pointer;padding:0 10px}
.iconbtn:hover{background:#ffffff88}
main{max-width:1240px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-left)) 80px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.1;margin:8px 0 6px;text-wrap:balance}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:17px;margin:16px 0 6px}
p.lead{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.band{background:var(--light);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px 18px}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted)}
label.f>span.req{color:var(--ext)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px;margin-top:4px}
textarea{resize:vertical;min-height:70px;line-height:1.4}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
input:disabled,textarea:disabled,select:disabled{opacity:.85;background:transparent}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--navy)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.go{background:var(--green);border-color:var(--green);color:var(--navy)}
.btn.warn{color:var(--ext)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--light);color:var(--ink);white-space:nowrap}
.chip.draft{background:#e0e6ea;color:#33434b}.chip.submitted{background:var(--blue);color:var(--navy)}.chip.queued{background:var(--yellow);color:var(--navy)}.chip.reviewed{background:var(--green);color:var(--navy)}
.risk{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:84px;min-height:40px;padding:4px 10px;border-radius:9px;border:1px dashed var(--line);font-weight:700;cursor:pointer;background:var(--field);color:var(--ink);white-space:nowrap}
.risk.Ext{background:var(--ext);color:#fff;border-color:var(--ext)}
.risk.High{background:var(--high);color:var(--navy);border-color:var(--high)}
.risk.Med{background:var(--med);color:var(--navy);border-color:var(--med)}
.risk.Low{background:var(--low);color:var(--navy);border-color:var(--low)}
.risk small{font-weight:600;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin:14px 0}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;min-height:140px}
.tile:hover{border-color:var(--blue)}
.tile b{font-size:19px}.tile .ic{width:46px;height:46px;border-radius:12px;background:var(--light);display:grid;place-items:center}
.tile.soon{cursor:default;opacity:.65}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
@media(max-width:600px){.secs{grid-template-columns:1fr}}
.tile.sec{min-height:170px;border-top:6px solid var(--blue)}
.tile.sec b{font-size:22px}
.tile.sec[data-sec=safety]{border-top-color:var(--green)}
.tile.sec.soon{border-top-color:var(--line)}
.tile .chip{align-self:flex-start}
.tile.soon:hover{border-color:var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;padding-bottom:2px}
.tab{flex:none;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme=dark] .tab.on{background:var(--blue);color:var(--navy)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.item:hover{border-color:var(--blue)}
.item .t{font-weight:700}.item .grow{flex:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* hazard rows */
.hz-head{display:none}
.hz{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;display:grid;gap:10px;grid-template-columns:1fr}
.hz .num{font-weight:700;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center}
.hz .rk{display:flex;gap:16px;flex-wrap:wrap}
.hz .rk>div{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.hz input.task{font-size:14px;min-height:36px;padding:6px 10px;margin-top:6px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0;background:var(--field);text-align:center}
.drop.over{border-color:var(--blue);background:var(--light)}
.ophotos{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.ophoto{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.ophoto .th{position:relative;flex:0 0 auto;width:min(38vw,220px)}
.ophoto .th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--field);display:block}
.ophoto .th .n{position:absolute;left:6px;top:6px;background:var(--blue);color:var(--navy);font-weight:700;border-radius:99px;min-width:26px;text-align:center;padding:1px 6px;font-size:13px}
@media (max-width:560px){.ophoto{flex-direction:column}.ophoto .th{width:100%}}
.hzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:12px 0}
.hzsq{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;cursor:pointer;overflow:hidden}
.hzsq b{font-size:17px;line-height:1.2}.hzsq:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hzsq .hzbar{position:absolute;left:0;top:0;right:0;height:10px;background:var(--acc)}
.hzsq .chip{position:absolute;right:10px;top:18px}
.hzsq.bld{background:var(--light);color:var(--ink);justify-content:space-between}.hzsq.bld svg{color:var(--blue)}
@media (max-width:420px){.hzgrid{grid-template-columns:1fr 1fr}.hzsq{padding:10px}.hzsq b{font-size:15px}.hzsq .muted{display:none}}
.hztabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-top:6px;scrollbar-width:thin}
.hztabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:99px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.hztabs button.on{background:var(--blue);border-color:var(--blue);color:var(--navy);font-weight:700}
.hztabs .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--light);color:var(--ink);font-size:12px;text-align:center}
.hzroombar{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap;position:sticky;top:64px;z-index:5;padding:8px 10px}.hzroombar select{min-height:40px}
.hzent{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:8px 10px;margin:8px 0}
.hzfields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 10px}
.hzf{margin:0;font-size:13px}.hzf.wide{grid-column:span 2}.hzf input,.hzf select{min-height:38px}
.hzf input.sid{font-weight:700}
.hzth{position:relative;display:inline-block}.hzth img{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--field);display:block}
.hzth .x{position:absolute;right:-6px;top:-6px;border:0;border-radius:99px;width:20px;height:20px;background:#c0392b;color:#fff;font-size:11px;cursor:pointer}
.plbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}.plbar select{max-width:200px;min-height:38px}.plbar .sep{width:8px}
#plwrap{position:relative;height:min(62vh,620px);min-height:320px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);touch-action:none;user-select:none;-webkit-user-select:none}
#plsvg{width:100%;height:100%;display:block;cursor:grab}
#plsvg .plgrid line{stroke:var(--line);stroke-width:1;opacity:.55}
#plsvg .plroom{fill:light-dark(rgba(229,248,255,.55),rgba(0,173,239,.08));stroke:var(--ink);stroke-width:3}
#plsvg .plroom.on{fill:light-dark(rgba(0,173,239,.16),rgba(0,173,239,.22));stroke:var(--blue)}
#plsvg .pllabel{fill:var(--ink);font-weight:700;text-anchor:middle;pointer-events:none}
#plsvg .pldim{fill:var(--muted);text-anchor:middle;pointer-events:none}#plsvg .pldim.edge{fill:var(--link);font-weight:700}
#plsvg .plhandle{fill:var(--blue);stroke:#fff;stroke-width:2;cursor:nwse-resize}
#plsvg .plgap{stroke:var(--card);stroke-width:5}
#plsvg .plwin{stroke:var(--link);stroke-width:2}#plsvg .plwin.on,#plsvg .pldoor.on,#plsvg .plswing.on{stroke:var(--blue);stroke-width:3}
#plsvg .pldoor{stroke:var(--ink);stroke-width:2}#plsvg .plswing{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:4 3}
#plsvg .plmark{fill:var(--blue);stroke:var(--navy);stroke-width:1.5}#plsvg .plmark.on{stroke:#e67e22;stroke-width:3}
#plsvg .plmarkt{fill:var(--ink);font-weight:700;pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-width:3}
#plsvg .plscale line{stroke:var(--ink);stroke-width:2}#plsvg .plscale text{fill:var(--ink);font-size:12px;text-anchor:middle}
#plmenu{position:absolute;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 12px)}
#plhint{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--card);padding:2px 8px;border-radius:8px;pointer-events:none;max-width:70%;text-align:right}
.plsamples{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.plsamp{border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13px;display:inline-flex;gap:6px;align-items:center}.plsamp.done{border-color:var(--blue);background:var(--light)}
.hzds{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.obsent{border-left:4px solid var(--blue);padding:4px 0 8px 12px;margin:12px 0}
.tablewrap{overflow-x:auto}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
.photos figure{margin:0;background:var(--field);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.photos img{display:block;width:100%;height:170px;object-fit:cover;background:#000}
.photos figcaption{padding:8px;display:flex;flex-direction:column;gap:6px}
.onsite{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:0 12px}
.onsite .chk{min-height:40px}
.sq{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sq:first-of-type{border-top:0}
.sq .row{gap:4px}.sq .chk{min-height:40px;padding:0 6px}
@media(max-width:600px){.sq{grid-template-columns:1fr}}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.docs a,.docs span,.docs .doclink{font-size:13px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--light);text-decoration:none;border:0;font-family:inherit;cursor:pointer;color:var(--link);min-height:28px}
.docs .doclink:hover{text-decoration:underline}
.docs span{color:var(--muted)}
@media(min-width:960px){
 .hz-head{display:grid;grid-template-columns:34px 1.1fr 1.6fr .8fr 104px 1.7fr 104px 44px;gap:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
 .hz{grid-template-columns:34px 1.1fr 1.6fr .8fr 104px 1.7fr 104px 44px;gap:8px;padding:8px 10px;margin:6px 0;align-items:start;border-radius:10px}
 .hz .num{flex-direction:column;gap:4px}
 .hz label.f>.lbl{display:none}
 .hz .rk{display:contents}
 .hz .rk>div>.lbl{display:none}
 .hz .more{grid-column:2/-1}
}
/* modal */
.scrim{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:20px}}
.modal{background:var(--card);color:var(--ink);width:100%;max-width:980px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{border-radius:18px}}
.modal.narrow{max-width:520px}
.modal h2{margin-top:0}
.mhead{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--card);padding:6px 0 10px;z-index:2}
.mhead h2{flex:1;margin:0}
.pick{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.pick{grid-template-columns:1fr 1fr}}
.pick h3{display:flex;align-items:center;gap:8px}
.pick .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{min-height:56px;border-radius:10px;border:2px solid transparent;padding:8px 10px;font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;text-align:left;color:#fff}
.opt.act{background:#0a3d8f}.opt.haz{background:#1f6b2a}
.opt.sel{border-color:var(--yellow);box-shadow:0 0 0 2px var(--navy) inset}
.opt.used{opacity:.55}
.matrix{display:grid;grid-template-columns:minmax(78px,1.5fr) repeat(5,minmax(44px,1fr));gap:4px;font-size:13px}
.matrix .h{line-height:1.2}.matrix .risk{min-width:0;padding:4px 2px;flex-direction:column;gap:0;line-height:1.1}
@media(max-width:600px){.matrix{font-size:12px}.matrix .h{padding:4px 1px;font-size:10.5px;overflow-wrap:anywhere}}
.matrix .h{font-weight:700;padding:6px;color:var(--muted)}
.matrix button{min-height:52px;border:0;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
.matrix button.cur{outline:3px solid var(--navy);outline-offset:-3px}
/* signature */
.sign{border:2px solid var(--navy);border-radius:14px;padding:14px;margin:22px 0 8px;background:var(--card)}
:root[data-theme=dark] .sign{border-color:var(--blue)}
.sign h3{margin:0 0 4px}
.pad{position:relative;width:100%;height:170px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;margin-top:8px;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.pad .line{position:absolute;left:16px;right:16px;bottom:38px;border-bottom:1px solid #9aa;pointer-events:none}
.pad .hint{position:absolute;left:16px;bottom:12px;font-size:13px;color:#789;pointer-events:none}
.signed img{max-height:110px;background:#fff;border-radius:8px;border:1px solid var(--line);padding:4px;max-width:100%}
/* tables (PC editors) */
.scroll{overflow-x:auto}
table.ed{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.ed.lib{min-width:1280px}
table.ed th{position:sticky;top:0;background:var(--light);text-align:left;padding:8px;font-size:13px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
table.ed td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ed td input,table.ed td select,table.ed td textarea{margin:0;font-size:14px;min-height:38px;padding:6px 8px}
table.ed td textarea{min-height:60px}
.tblwrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;position:sticky;top:56px;z-index:5;background:var(--bg);padding:8px 0}
.toolbar input[type=search]{max-width:280px;margin:0}
.toolbar select{width:auto;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:80;max-width:92vw;box-shadow:0 6px 20px #0005}
.steps{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.steps button{flex:1 0 auto;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;padding:6px 12px;color:var(--ink)}
.steps button.on{background:var(--blue);color:var(--navy);border-color:var(--blue)}
.steps button .ok{color:#3c7d16}
.check li{margin:4px 0}.check .no{color:var(--ext)}.check .yes{color:#3c7d16}
.note{font-size:14px;color:var(--muted);white-space:pre-wrap}
.callout{border-left:4px solid var(--ext);padding:8px 12px;background:light-dark(#fff4f4,#2a1416);border-radius:8px;font-weight:700;color:light-dark(#9b1c1c,#ffb4b4)}
.login{max-width:420px;margin:7vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.login .logo{display:flex;justify-content:center;margin-bottom:10px}
.login .logo svg,.login .logo img{height:84px;width:auto}
.err{color:var(--ext);font-weight:600;font-size:14px}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);margin-top:16px;z-index:4}
details>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
@media(max-width:600px){main{padding-top:10px}.top .brand span{display:none}.hide-sm{display:none!important}}
@media(prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
@media print{.top,.sticky-actions,.toolbar{display:none}}

const MATRIX = {'1A':'Ext','1B':'Ext','1C':'Ext','1D':'Ext','1E':'High','2A':'Ext','2B':'Ext','2C':'Ext','2D':'High','2E':'High','3A':'Ext','3B':'High','3C':'High','3D':'Med','3E':'Med','4A':'High','4B':'High','4C':'Med','4D':'Low','4E':'Low'};

/* ---------- SOP / SWP references in control measures ---------- */
const DOC_NUM = '\\d+(?:(?:\\.\\s?|,(?=\\d))\\d+){0,3}'; // 1.11, 4, 2.3.1; "1,19" (no space) is read as 1.19
const DOC_RE = new RegExp(`\\b(SWP|SJP|SOP)s?\\b\\s*[:#]?\\s*(${DOC_NUM}(?:\\s*(?:,|;|&|and)\\s*${DOC_NUM})*)`, 'gi');
const DOC_NUM_RE = new RegExp(DOC_NUM, 'g');
const docKey = (pre, n) => pre.toUpperCase() + ' ' + n.replace(/\s/g, '').replace(/,/g, '.');
function docCodes(text) {
  const out = [];
  String(text || '').replace(DOC_RE, (m, pre, nums) => { (nums.match(DOC_NUM_RE) || []).forEach(n => { const k = docKey(pre, n); if (!out.includes(k)) out.push(k); }); return m; });
  return out;
}
// Rewrites document numbers in a text, e.g. {"SJP 1.3": "SOP 4.2"}; lists are regrouped by type.
function renumberText(text, map) {
  return String(text || '').replace(DOC_RE, (m, pre, nums) => {
    const codes = (nums.match(DOC_NUM_RE) || []).map(n => docKey(pre, n)), mapped = codes.map(c => map[c] || c);
    if (mapped.every((c, i) => c === codes[i])) return m;
    const groups = [];
    mapped.forEach(c => { const t = c.split(' ')[0], n = c.slice(t.length + 1), g = groups[groups.length - 1]; if (g && g.t === t) g.n.push(n); else groups.push({t, n: [n]}); });
    return groups.map(g => g.t + ' ' + g.n.join(', ')).join('; ');
  });
}
const DOC_TYPES = ['SWP', 'SOP', 'SJP'];
function normReg(r) {
  const code = String(r.code || ((r.type || '') + ' ' + (r.number || ''))).trim().toUpperCase().replace(/\s+/g, ' ');
  const type = r.type || code.split(' ')[0] || 'SWP', number = r.number != null && r.number !== '' ? String(r.number) : code.slice(type.length + 1);
  return {code: type + ' ' + number, type, number, title: r.title || '', rev: r.rev || '', revDate: r.revDate || '', status: r.status === 'Retired' ? 'Retired' : 'Current', file: r.file || null, fileName: r.fileName || '', url: r.url || ''};
}
const docNorm = c => String(c || '').toUpperCase().replace(/\s+/g, ' ').replace(/(^| |\.)0+(?=\d)/g, '$1');
const docMap = () => { const m = {}; (S.cfg.register || []).forEach(d => { m[d.code] = d; const n = docNorm(d.code); if (!(n in m) || m[n].status === 'Retired') m[n] = d; }); return new Proxy(m, {get: (t, k) => typeof k === 'string' ? (t[k] || t[docNorm(k)]) : t[k]}); };
const docHasTarget = d => d && (d.file || /^https:\/\//i.test(d.url || ''));
const docLabel = (c, d) => c + (d && d.title ? ' – ' + d.title : '') + (d && d.rev ? ' (Rev ' + d.rev + ')' : '');
function docChips(text, long) {
  const m = docMap(), codes = docCodes(text);

  return '<div class="docs">' + codes.map(c => { const d = m[c]; const t = docLabel(c, d); return docHasTarget(d) ? `<button type="button" class="doclink" data-doc="${esc(c)}" title="${esc(t)}">${esc(long ? t : c)}${d.file && DOCS_CACHED.has(d.file.path) ? ' ✓' : ''}</button>` : `<span title="${esc(t)} (no file yet)">${esc(long ? t : c)}${long ? ' (no file yet)' : ''}</span>`; }).join('') + '</div>';
}

  const H1 = t => P(t, 'Heading1', '<w:keepNext/>'), H2 = t => P(t, 'Heading2', '<w:keepNext/>');
  const EMPTY = '<w:p><w:pPr><w:pStyle w:val="BodyText"/></w:pPr></w:p>';
  const paras = t => obsParas(t).map(x => P(x)).join('');
  let docPr = 100;
  const pic = (rid, cx, cy, name) => { const id = ++docPr; return `<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${id}" name="${X(name)}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="${X(name)}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>`; };
  // Hive blue table (as in the template)
  const BAND = '<w:trPr><w:cnfStyle w:val="000000010000" w:firstRow="0" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:oddVBand="0" w:evenVBand="0" w:oddHBand="0" w:evenHBand="1" w:firstRowFirstColumn="0" w:firstRowLastColumn="0" w:lastRowFirstColumn="0" w:lastRowLastColumn="0"/></w:trPr>';
  const HEADROW = '<w:trPr><w:tblHeader/><w:cnfStyle w:val="100000000000" w:firstRow="1" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:oddVBand="0" w:evenVBand="0" w:oddHBand="0" w:evenHBand="0" w:firstRowFirstColumn="0" w:firstRowLastColumn="0" w:lastRowFirstColumn="0" w:lastRowLastColumn="0"/></w:trPr>';
  const LINE = 'w:val="single" w:sz="4" w:space="0" w:color="81DBFF"';
  const cell = (w, t, center, i, n) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${n > 1 ? `<w:tcBorders>${i > 0 ? `<w:left ${LINE}/>` : ''}${i < n - 1 ? `<w:right ${LINE}/>` : ''}</w:tcBorders>` : ''}</w:tcPr><w:p><w:pPr><w:pStyle w:val="BodyText"/><w:spacing w:before="60" w:after="60"/>${center ? '<w:jc w:val="center"/>' : '<w:jc w:val="left"/>'}</w:pPr>${R(t)}</w:p></w:tc>`;
  const table = (widths, head, rows, centre = []) => `<w:tbl><w:tblPr><w:tblStyle w:val="HiveTableblue"/><w:tblW w:w="0" w:type="auto"/><w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>
    <w:tr>${HEADROW}${head.map((h, i) => `<w:tc><w:tcPr><w:tcW w:w="${widths[i]}" w:type="dxa"/></w:tcPr><w:p><w:pPr><w:pStyle w:val="BodyText"/><w:spacing w:before="60" w:after="60"/>${centre.includes(i) ? '<w:jc w:val="center"/>' : '<w:jc w:val="left"/>'}</w:pPr>${R(h)}</w:p></w:tc>`).join('')}</w:tr>
    ${rows.map((r, k) => `<w:tr>${k % 2 ? BAND : '<w:trPr><w:cantSplit/></w:trPr>'}${r.map((t, i) => cell(widths[i], t, centre.includes(i), i, r.length)).join('')}</w:tr>`).join('')}</w:tbl>`;
  // project table (no borders, bold labels)
  const infoRow = (l, v) => `<w:tr><w:tc><w:tcPr><w:tcW w:w="2694" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:pStyle w:val="BodyText"/><w:spacing w:before="20" w:after="20"/><w:jc w:val="left"/></w:pPr>${R(l, true)}</w:p></w:tc><w:tc><w:tcPr><w:tcW w:w="6666" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:pStyle w:val="BodyText"/><w:spacing w:before="20" w:after="20"/><w:jc w:val="left"/></w:pPr>${R(v)}</w:p></w:tc></w:tr>`;
  const NOBORDER = '<w:tblBorders><w:top w:val="none" w:sz="0" w:space="0" w:color="auto"/><w:left w:val="none" w:sz="0" w:space="0" w:color="auto"/><w:bottom w:val="none" w:sz="0" w:space="0" w:color="auto"/><w:right w:val="none" w:sz="0" w:space="0" w:color="auto"/><w:insideH w:val="none" w:sz="0" w:space="0" w:color="auto"/><w:insideV w:val="none" w:sz="0" w:space="0" w:color="auto"/></w:tblBorders>';
  const info = `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="9360" w:type="dxa"/>${NOBORDER}<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr><w:tblGrid><w:gridCol w:w="2694"/><w:gridCol w:w="6666"/></w:tblGrid>
    ${[['Project #:', d.projectNo], ['Date:', obsDate(d.date)], ['Time:', obsTime(d.time)], ['Location:', d.location], ['Hive Personnel:', d.personnel], ['Prime Contractor:', d.prime], ['Contractor On-Site:', d.contractor], ['ECCC Weather:', d.weather]].map(([l, v]) => infoRow(l, v)).join('')}</w:tbl>`;

  let b = EMPTY + P('SITE OBSERVATION REPORT', 'AppendixHeading') + info;
  // 1. general observations – timed entries
  b += H1('General Observations') + P('The following general observations were made during the Site visit.' + (o.photos.length ? ' Supporting photographs are included in Attachment A.' : ''));
  (d.entries || []).forEach(e => {
    const items = obsLines(e.text); if (!e.time && !items.length) return;
    if (e.time) b += `<w:p><w:pPr><w:pStyle w:val="ListParagraph"/><w:keepNext/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="12"/></w:numPr><w:rPr><w:b/><w:bCs/></w:rPr></w:pPr>${R(obsTime(e.time, true), true)}</w:p>`;
    items.forEach(t => { b += `<w:p><w:pPr><w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="${e.time ? 1 : 0}"/><w:numId w:val="12"/></w:numPr></w:pPr>${R(t)}</w:p>`; });
  });
  // 2. equipment
  const eq = (d.equipment || []).filter(r => (r.type || '').trim());
  if (eq.length) b += H1('List of Equipment On-site') + table([6946, 2414], ['Equipment Type', 'Quantity'], eq.map(r => [r.type, r.qty]), [1]) + EMPTY;
  // 3. site personnel
  const crew = (d.crew || []).filter(r => (r.name || '').trim() || (r.contact || '').trim());
  if (crew.length) b += H1('Site Personnel') + table([2340, 2340, 4680], ['Personnel', '', 'Contact Info (Phone/Email)'], crew.map(r => [r.role, r.name, r.contact])) + EMPTY;
  // 4–6. text sections
  if (obsParas(d.workPlanned).length) b += H1('Work Planned and Discussions with Contractor') + paras(d.workPlanned);
  if (obsParas(d.ppe).length) b += H1('Personal Protective Equipment') + paras(d.ppe);
  if (obsParas(d.security).length) b += H1('Abatement Control & Site Security') + paras(d.security);
  // 7. waste
  if (obsParas(d.wasteWhere).length || d.wasteSecure) {
    b += H1('Waste Storage');
    if (obsParas(d.wasteWhere).length) b += H2('Where is the Waste stored?') + paras(d.wasteWhere);
    if (d.wasteSecure) b += H2('Is it Secure (yes/no)') + P(d.wasteSecure === 'yes' ? 'Yes.' : d.wasteSecure === 'no' ? 'No.' + (d.wasteSecureNote ? ' ' + d.wasteSecureNote : '') : 'Not applicable.');
  }
  // 8. air monitoring
  const air = (d.air || []).filter(r => [r.id, r.location, r.wind, r.result].some(x => (x || '').trim()));
  if (air.length) b += H1('Air Monitoring Results') + P('Air monitoring was conducted for this visit. The table below represents the result of the air monitoring exercise.' + (o.attachB ? ' Lab certificates are presented in Attachment B.' : '')) + table([2340, 2340, 2340, 2340], ['Sample ID', 'Location', 'Wind Direction', 'Result'], air.map(r => [r.id, r.location, r.wind, r.result])) + EMPTY;
  // 9. action items
  const acts = obsLines(d.actions);
  if (acts.length) b += H1('Action Items') + P('Based on the Site observations the following action items are presented for consideration:') + acts.map(t => `<w:p><w:pPr><w:pStyle w:val="BodyText"/><w:numPr><w:ilvl w:val="6"/><w:numId w:val="1"/></w:numPr></w:pPr>${R(t)}</w:p>`).join('');
  // 10. closing – author signs on the left; reviewer signs outside the app on the right
  b += H1('Closing') + P(`This observation report was completed by ${o.authorName}${o.reviewerName ? ` and reviewed by ${o.reviewerName}` : ''}, on behalf of Hive. Should there be any questions or concerns, please contact the undersigned at anytime.`, 'BodyText', '<w:keepNext/>') + P('Sincerely,', 'BodyText', '<w:keepNext/>');
  const sc = (inner, w) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:vAlign w:val="bottom"/></w:tcPr>${inner}</w:tc>`;
  const sp = (inner, keep = true) => `<w:p><w:pPr>${keep ? '<w:keepNext/>' : ''}<w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>${inner}</w:p>`;
  const who = (n, t) => sp(R(n)) + sp(R(t)) + sp(R('Hive Engineering Limited'), false);
  b += `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="9360" w:type="dxa"/>${NOBORDER}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="04A0" w:firstRow="0" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:noHBand="1" w:noVBand="1"/></w:tblPr><w:tblGrid><w:gridCol w:w="4680"/><w:gridCol w:w="4680"/></w:tblGrid>
    <w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="720"/></w:trPr>${sc(sp(o.sig ? `<w:r><w:rPr><w:noProof/></w:rPr>${pic(o.sig.rid, o.sig.cx, o.sig.cy, 'Signature')}</w:r>` : ''), 4680)}${sc(sp(''), 4680)}</w:tr>
    <w:tr><w:trPr><w:cantSplit/></w:trPr>${sc(who(o.authorName, o.authorTitle), 4680)}${sc(o.reviewerName ? who(o.reviewerName, o.reviewerTitle) : sp('', false), 4680)}</w:tr></w:tbl>`;
  // sections (page setup and headers/footers exactly as in the template)
  const SECT_MAIN = '<w:sectPr><w:footerReference w:type="default" r:id="rId10"/><w:headerReference w:type="first" r:id="rId11"/><w:footerReference w:type="first" r:id="rIdHnF1"/><w:pgSz w:w="12240" w:h="15840" w:code="1"/><w:pgMar w:top="966" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/><w:cols w:space="720"/><w:titlePg/><w:docGrid w:linePitch="354"/></w:sectPr>';
  const SECT_ACOVER = '<w:sectPr><w:headerReference w:type="default" r:id="rId12"/><w:footerReference w:type="default" r:id="rId13"/><w:headerReference w:type="first" r:id="rId14"/><w:footerReference w:type="first" r:id="rId15"/><w:pgSz w:w="12240" w:h="15840" w:code="1"/><w:pgMar w:top="6804" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/><w:cols w:space="720"/><w:vAlign w:val="center"/><w:docGrid w:linePitch="354"/></w:sectPr>';
  const SECT_PHOTOS = '<w:sectPr><w:headerReference w:type="default" r:id="rId24"/><w:footerReference w:type="default" r:id="rId25"/><w:pgSz w:w="12240" w:h="15840" w:code="1"/><w:pgMar w:top="966" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/><w:pgNumType w:start="1"/><w:cols w:space="720"/><w:docGrid w:linePitch="354"/></w:sectPr>';
  const SECT_BCOVER = '<w:sectPr><w:headerReference w:type="default" r:id="rId26"/><w:footerReference w:type="default" r:id="rId27"/><w:pgSz w:w="12240" w:h="15840" w:code="1"/><w:pgMar w:top="6804" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/><w:pgNumType w:start="1"/><w:cols w:space="720"/><w:docGrid w:linePitch="354"/></w:sectPr>';
  const endSect = s => `<w:p><w:pPr><w:pStyle w:val="BodyText"/>${s}</w:pPr></w:p>`;
  const cover = (letter, title) => `<w:p><w:pPr><w:pStyle w:val="AppendixHeading"/><w:spacing w:after="100"/><w:jc w:val="left"/></w:pPr>${R('Attachment ' + letter)}</w:p><w:p><w:pPr><w:pStyle w:val="AppendixTitle"/><w:jc w:val="left"/></w:pPr>${R(title)}</w:p>`;
  const tail = [];
  if (o.photos.length) {
    let ph = P('Site Sketch/Photos', 'AppendixHeading', '<w:jc w:val="left"/>');
    o.photos.forEach(p => {
      ph += `<w:p><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="60"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:noProof/></w:rPr>${pic(p.rid, p.cx, p.cy, 'Photo ' + p.n)}</w:r></w:p>`;
      ph += P(`Photo ${p.n}: ${obsDate(p.date)} – ${p.caption || ''}`.replace(/ – $/, ''), 'Caption', '<w:jc w:val="center"/>');
    });
    tail.push([SECT_ACOVER, cover('A', 'Photographs')], [SECT_PHOTOS, ph]);
  }
  if (o.attachB) tail.push([SECT_BCOVER, cover('B', o.attachBTitle || 'Air Monitoring Results') + EMPTY]);
  // each section's sectPr closes it: main → (A cover → photos) → (B cover); the last one sits at the end of the body
  let prev = SECT_MAIN;
  tail.forEach(([sect, content]) => { b += endSect(prev) + content; prev = sect; });
  return b + prev;
}

async function obsDocx(d, o, unzip, zip) {
  // unzip/zip: fflate functions; o.template: Uint8Array of obs-template.docx; o.images: [{rid, name, bytes}]
  const files = unzip(o.template);
  const dec = new TextDecoder(), enc = new TextEncoder();
  const X = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  files['word/document.xml'] = enc.encode(dec.decode(files['word/document.xml']).replace('{{BODY}}', obsDocxBody(d, o)));
  files['word/_rels/document.xml.rels'] = enc.encode(dec.decode(files['word/_rels/document.xml.rels']).replace('{{RELS}}', o.images.map(im => `<Relationship Id="${im.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${im.name}"/>`).join('')));
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  files['docProps/core.xml'] = enc.encode(dec.decode(files['docProps/core.xml']).replace('{{TITLE}}', X(o.title || 'Site Observation Report')).replace('{{AUTHOR}}', X(o.authorName || '')).split('{{NOW}}').join(now));
  o.images.forEach(im => { files['word/media/' + im.name] = [im.bytes, {level: 0}]; });
  return zip(files, {level: 6});
}

function newObs(from) {
  const id = uid(), now = new Date().toISOString(), f = from ? clone(from.data) : {};

  const data = {
    projectNo: keep('projectNo'), date: today(), time: nowHM(), location: keep('location'), personnel: keep('personnel') || staffLabel(me),
    prime: keep('prime'), contractor: keep('contractor'), weather: '',
    entries: [{id: uid(), time: nowHM(), text: ''}],
    equipment: from ? (f.equipment || []) : [],

    workPlanned: '', ppe: '', security: '', wasteWhere: '', wasteSecure: '', air: [], actions: '', photos: [],
    authorName: LS.get('obsAuthorName:' + me.id) || me.full_name, authorTitle: LS.get('obsAuthorTitle:' + me.id) || me.title || '',
    reviewerName: keep('reviewerName'), reviewerTitle: keep('reviewerTitle'), attachB: from ? f.attachB !== false : true, attachBTitle: keep('attachBTitle') || 'Air Monitoring Results', sign: null
  };
  const n = {id, section: 'observation', kind: 'observation_report', owner: me.id, pm: from ? from.pm : null, status: 'draft', title: data.location, project_no: data.projectNo, data, created_at: now, updated_at: now, _dirty: true, _local: true};

function obsProblems(n) {
  const d = n.data, out = [];

/* photos: kept as files on the device (IndexedDB) and in the hn-photos bucket – not inside the note, so syncing stays light */
async function shrinkToBlob(file, max = 1600, q = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(`“${file.name || 'That file'}” isn’t a picture this browser can read.`)); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', q));
    return {blob, w: c.width, h: c.height};
  } finally { URL.revokeObjectURL(url); }
}
async function addObsPhotos(files) {
  const imgs = [...files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp|gif)$/i.test(f.name || ''));
  if (!imgs.length) { toast('Those files aren’t photos.'); return; }
  const room = OBS_MAX_PHOTOS - (P.data.photos || []).length; if (room <= 0) { toast(`Up to ${OBS_MAX_PHOTOS} photos per report.`); return; }
  const list = imgs.slice(0, room); if (imgs.length > room) toast(`Only ${room} more photo${room > 1 ? 's' : ''} fit (up to ${OBS_MAX_PHOTOS}).`);
  P.data.photos = P.data.photos || []; toast(`Adding ${list.length} photo${list.length > 1 ? 's' : ''}…`, 1500);
  for (const f of list) {
    try { const {blob, w, h} = await shrinkToBlob(f), id = uid(); await DB.set(phKey(id), blob);
      P.data.photos.push({id, caption: '', date: P.data.date || today(), at: new Date().toISOString(), w, h}); }
    catch (e) { toast(e.message || String(e)); }
  }
  touch(); const y = scrollY; render(); scrollTo(0, y);
}
async function photoBlob(p) {
  const b = await DB.get(phKey(p.id)); if (b) return b;
  if (S.mode === 'live' && p.path && S.online) { const {data, error} = await Live.sb.storage.from('hn-photos').download(p.path); if (!error && data) { await DB.set(phKey(p.id), data); return data; } }
  return null;
}
async function fillThumbs() {
  for (const img of $$('img[data-thumb]')) {
    const id = img.dataset.thumb, p = (P.data.photos || []).find(x => x.id === id); if (!p) continue;
    if (!PH_URL[id]) { const b = await photoBlob(p); if (b) PH_URL[id] = URL.createObjectURL(b); }
    if (PH_URL[id]) img.src = PH_URL[id]; else img.alt = S.online ? 'Photo not found' : 'Photo not on this device (offline)';
  }
}
function dropZone() {
  const z = $('#odrop'); if (!z) return;
  ['dragenter', 'dragover'].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.remove('over'); }));
  z.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files; if (f && f.length) addObsPhotos(f); });
}

/* Word export */
async function ensureFflate() {
  if (window.fflate) return;
  try { await loadScript('vendor/fflate.min.js'); } catch (e) { await loadScript('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js'); }
}
async function obsTemplate() {
  const r = await fetch(OBS_TPL_URL); if (!r.ok) throw new Error('The Word template (obs-template.docx) is missing on the website.');
  return new Uint8Array(await r.arrayBuffer());
}
async function sigForWord(dataUrl) { // crop the drawn signature to the ink, keep it on white
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const px = g.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) { const k = (y * c.width + x) * 4; if (px[k + 3] > 20 && px[k] + px[k + 1] + px[k + 2] < 600) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
  if (x1 < 0) return null;
  const m = 6; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(c.width - 1, x1 + m); y1 = Math.min(c.height - 1, y1 + m);
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1; o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  const blob = await new Promise(res => o.toBlob(res, 'image/png'));
  return {bytes: new Uint8Array(await blob.arrayBuffer()), w: o.width, h: o.height};
}
async function obsWord(n) {
  const d = n.data, EMU = 914400;
  await ensureFflate();
  const template = await obsTemplate(), images = [], photos = [], missing = [];
  for (const [i, p] of (d.photos || []).entries()) {
    const b = await photoBlob(p); if (!b) { missing.push(i + 1); continue; }
    const W = 5.6 * EMU, Hmax = 3.45 * EMU; let cx = W, cy = W * (p.h || 3) / (p.w || 4); if (cy > Hmax) { cy = Hmax; cx = Hmax * (p.w || 4) / (p.h || 3); }
    const rid = 'rIdHnP' + (i + 1); images.push({rid, name: `hn-photo-${i + 1}.jpeg`, bytes: new Uint8Array(await b.arrayBuffer())});
    photos.push({rid, cx: Math.round(cx), cy: Math.round(cy), n: photos.length + 1, caption: p.caption, date: p.date || d.date});
  }
  if (missing.length) throw new Error(`Photo${missing.length > 1 ? 's' : ''} ${missing.join(', ')} ${missing.length > 1 ? 'aren’t' : 'isn’t'} on this device${S.online ? ' or in the cloud' : ' – go online to download them'}.`);
  let sig = null;
  if (d.sign && d.sign.sig) { const s = await sigForWord(d.sign.sig); if (s) { const h = Math.min(0.6 * EMU, (1.9 * EMU) * s.h / s.w), w = h * s.w / s.h; images.push({rid: 'rIdHnSig', name: 'hn-signature.png', bytes: s.bytes}); sig = {rid: 'rIdHnSig', cx: Math.round(w), cy: Math.round(h)}; } }
  const pm = staffById(n.pm);
  const bytes = await obsDocx(d, {template, images, photos, sig, attachB: d.attachB !== false, attachBTitle: d.attachBTitle,
    authorName: (d.authorName || '').trim() || (staffById(n.owner) || {}).full_name || '', authorTitle: d.authorTitle || '',
    reviewerName: (d.reviewerName || '').trim() || (pm ? pm.full_name : ''), reviewerTitle: (d.reviewerTitle || '').trim() || (pm && pm.title) || '',
    title: `Site Observation Report – ${d.projectNo || ''}`}, fflate.unzipSync, fflate.zipSync);
  return new Blob([bytes], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

    doc.autoTable({startY: y0, theme: 'plain', margin: {left: M, right: M}, styles: {fontSize: 8.6, cellPadding: 1.8, textColor: navy},
      columnStyles: {0: {fontStyle: 'bold', cellWidth: 96}, 2: {fontStyle: 'bold', cellWidth: 70}, 4: {fontStyle: 'bold', cellWidth: 34}},
      body: [['Building Name:', tx(d.buildingName), 'Project #:', tx(d.projectNo), 'Date:', fmtD(d.date)], ['Room #/Description:', tx(roomLabel), 'Surveyor(s):', {content: tx(d.surveyors), colSpan: 3}], ['Site Contact (Name and Position):', {content: tx(d.siteContact), colSpan: 5}]]});

    didParseCell: c => { if (c.section === 'head') c.cell.styles.fillColor = blue; }});
  table('Hydrocarbon Storage', [['cap', 'Tank Capacity', 1], ['type', 'Tank Type (AST/UST)', 1], ['material', 'Tank Material', 1], ['contents', 'Contents', 1], ['cond', 'Condition (G/F/P)', 0.9], ['staining', 'Staining', 0.8], ['contain', '2nd Containment', 0.9]],
    (b.tanks || []).map(tk => ['cap', 'type', 'material', 'contents', 'cond', 'staining', 'contain'].map(k => tk[k] || '')), doc.lastAutoTable.finalY + 14, {none: 'No hydrocarbon storage recorded.'});

    const all = HZ_T.flatMap(t => hzItems(d, t.k).map(it => [it, t]));

      const col = i % 2, row = Math.floor((i % 6) / 2), x = M + col * (cw + 16), y = 82 + row * (ch + 22);
      const b2 = await photoBlob(p); const [it, t] = all.find(([x]) => x.id === p.ref) || [{}, {}];
      if (b2) { const url = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b2); }); const k = Math.min(cw / (p.w || 4), ch / (p.h || 3)); const w = (p.w || 4) * k, h = (p.h || 3) * k; doc.addImage(url, 'JPEG', x + (cw - w) / 2, y + (ch - h) / 2, w, h, 'hzp' + p.id, 'FAST'); }

/* ---------- menu ---------- */
function openMenu() {
  const m = modal(`<div class="mhead"><h2>${esc(S.me.full_name)}</h2><button class="iconbtn" data-x aria-label="Close">✕</button></div>
   <p class="muted small">User name ${esc(S.me.username)} · ${S.me.role === 'admin' ? 'Admin' : 'Staff'}${S.me.is_pm ? ' · Project manager' : ''}</p>
   ${S.mode === 'demo' ? `<label class="f">Viewing as (demo)<select id="va">${S.staff.map(s => `<option value="${esc(s.id)}" ${s.id === S.me.id ? 'selected' : ''}>${esc(s.full_name)} – ${s.role === 'admin' ? 'admin' : s.is_pm ? 'PM' : 'staff'}</option>`).join('')}</select></label>` : ''}
   <div class="list" style="margin-top:12px"><button class="item" data-go="home">Sections</button><button class="item" data-go="list">Safety plans</button><button class="item" data-go="library">Activities &amp; hazards library</button><button class="item" data-go="docs">SOP / SWP documents</button>${isAdmin() ? '<button class="item" data-go="admin">Admin</button>' : ''}
   ${S.mode === 'live' ? `<label class="item chk" style="cursor:pointer"><input type="checkbox" data-act="docsoffline" ${LS.get('docsOffline') === '0' ? '' : 'checked'}><span class="grow">Keep SOPs / SWPs on this device for offline use</span><span class="muted small">${docOfflineCount()}</span></label><button class="item" data-act="syncnow">Sync now<span class="grow"></span><span class="muted small">${S.lastSync ? 'last ' + fmtDT(S.lastSync) : ''}</span></button><button class="item" data-act="chpw">Change password</button>` : ''}
   ${S.mode === 'demo' ? '<button class="item" data-act="demoreset">Reset demo data</button>' : ''}
   ${installBtn('item')}<button class="item" data-act="signout">Sign out</button></div><p class="muted small">Hive-Notes ${VERSION}${S.mode === 'demo' ? ' · demo mode' : ''}</p>`, 'narrow');
  m.addEventListener('click', e => { if (e.target.closest('[data-x]') || e.target.closest('[data-go]')) closeModal(); });
  const va = $('#va', m); if (va) va.onchange = async () => { LS.set('demoUser', va.value); S.me = S.staff.find(s => s.id === va.value); closeModal(); LIB = REG = TPL = EM = null; go('home', null, true); };
}

/* ---------- global click handler ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g && !g.closest('.modal')) { e.preventDefault(); const v = g.dataset.go; if (['library', 'docs', 'templates', 'emergency'].includes(v) && S.view !== v) { LIB = REG = TPL = EM = null; } go(v, g.dataset.p || null); return; }
  if (g && g.closest('.modal')) { const v = g.dataset.go; LIB = REG = TPL = EM = null; go(v, g.dataset.p || null); return; }
  const st = e.target.closest('[data-step]'); if (st && P) { LS.set('step:' + P.id, st.dataset.step); render(); window.scrollTo(0, 0); return; }
  if (e.target.matches('[data-close-scrim]')) { closeModal(); return; }
  const dl = e.target.closest('[data-doc]'); if (dl && !dl.disabled) { e.preventDefault(); openDoc(dl.dataset.doc); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, i = a.dataset.i != null ? +a.dataset.i : null;
  if (await obsClick(act, a, i)) return;
  if (await hzClick(act, a, i)) return;
  switch (act) {
    case 'menu': openMenu(); break;
    case 'install': closeModal(); installApp(); break;
    case 'temppw': tempPassword(staffById(a.dataset.id)); break;
    case 'signout': closeModal(); await B().signOut(); S.me = null; P = null; render(); break;
    case 'syncnow': closeModal(); sync(true); break;
    case 'chpw': closeModal(); S.needPassword = true; render(); break;
    case 'demoreset': if (await ask('Reset demo?', 'Puts the sample data back and clears your demo plans.', 'Reset', 1)) { await DB.set('demo:notes', {}); await DB.set('demo:cfg', null); await DB.set('demo:staff', null); S.staff = clone(DEMO_STAFF); S.me = S.staff.find(s => s.id === S.me.id) || S.staff[0]; await afterLogin(); } break;
    case 'newplan': newPlan(); break;
    case 'emergAll': LS.set('emergAll', a.checked ? '1' : '0'); render(); break;
    case 'pick': openPicker(); break;
    case 'tpl': openTemplates(); break;
    case 'blank': P.data.rows.push({name: '', desc: '', resp: 'Employee', risk: '', control: '', residual: '', task: '', due: '', done: ''}); touch(); render(); break;
    case 'delrow': if (await ask('Remove row?', `Remove “${P.data.rows[i].name || 'row ' + (i + 1)}” from this plan?`, 'Remove', 1)) { P.data.rows.splice(i, 1); touch(); render(); } break;
    case 'up': if (i > 0) { const r = P.data.rows; [r[i - 1], r[i]] = [r[i], r[i - 1]]; touch(); render(); } break;
    case 'risk': openRisk(i, a.dataset.k); break;
    case 'clearpad': { const t = sigTarget(a.dataset.p); t.sig = null; t.at = null; touch(); render(); break; }
    case 'locpin': pinLocation(); break;
    case 'delphoto': if (await ask('Remove photo?', 'Remove this photo from the plan?', 'Remove', 1)) { P.data.photos.splice(i, 1); touch(); render(); } break;
    case 'addcrew': P.data.crew = P.data.crew || []; P.data.crew.push({name: '', sig: null, at: null}); touch(); render(); break;
    case 'delcrew': P.data.crew.splice(i, 1); touch(); render(); break;
    case 'savetpl': { const name = await promptText('Save as template', 'Template name', P.data.template || P.data.title); if (!name) break; const t = {id: 'T' + uid().slice(0, 8), name, rows: P.data.rows.map(r => ({name: r.name, task: r.task || '', desc: r.desc, resp: r.resp, risk: r.risk, control: r.control, residual: r.residual}))}; try { await saveCfg('templates', [...S.cfg.templates, t]); toast('Template saved'); } catch (x) {} break; }
    case 'preview': { toast('Building PDF…', 2500); const b = await planPdf(P); saveFile(b, pdfName(P)); break; }
    case 'pdf': { let b; try { b = S.mode === 'live' && P.pdf_path && S.online && !P._queued ? await Live.pdf(P) : await planPdf(P); } catch (x) { b = await planPdf(P); } saveFile(b, pdfName(P)); break; }
    case 'submit': submitPlan(); break;
    case 'reviewed': P.status = 'reviewed'; P.reviewed_at = new Date().toISOString(); P.reviewed_by = S.me.id; P._dirty = true; await saveNotes(); queueSync(200); render(); toast('Marked reviewed'); break;
    case 'reopen': if (await ask('Reopen to edit?', 'The plan goes back to draft. Submit it again when you are done, and the PM gets the new version.', 'Reopen')) { P.status = 'draft'; touch(); render(); } break;
    case 'dup': newPlan(P); toast('Copied. Signatures and dates were cleared.'); break;
    case 'delplan': if (await ask('Delete plan?', 'This deletes the plan for everyone. It can’t be undone.', 'Delete', 1)) { if (S.mode === 'demo' || P._local) delete S.notes[P.id]; else { P._deleted = true; } S.outbox = S.outbox.filter(o => o.id !== P.id); await DB.set(key('outbox'), S.outbox); await saveNotes(); queueSync(200); if (isObs(P) || isHaz(P)) { for (const ph of P.data.photos || []) { try { await DB.set(phKey(ph.id), undefined); } catch (e) {} } if (S.mode === 'live' && S.online) { const paths = (P.data.photos || []).map(x => x.path).filter(Boolean); if (paths.length) Live.sb.storage.from('hn-photos').remove(paths).catch(() => {}); } go(isHaz(P) ? 'hazlist' : 'obslist', null, true); } else go('list', null, true); } break;
    // library
    case 'libadd': LIB.unshift({id: 'L' + uid().slice(0, 8), name: '', kind: 'Activity', loc: 'Field', desc: '', resp: 'Employee', risk: '', control: '', residual: '', active: true}); LS.set('libq', ''); viewLibrary($('#app')); $('[data-li="0"] textarea').focus(); break;
    case 'libdel': if (!libFilled(LIB[i])) { LIB.splice(i, 1); viewLibrary($('#app')); $$('[data-act=libsave],[data-act=libundo]').forEach(b => b.disabled = JSON.stringify(LIB) === JSON.stringify(S.cfg.library)); break; } if (await ask('Delete row?', `Delete “${LIB[i].name}” from the library? Plans that already use it keep their copy. (Untick “In use” instead to hide it without deleting.)`, 'Delete', 1)) { LIB.splice(i, 1); viewLibrary($('#app')); } break;
    case 'librisk': pickCode(normCode(LIB[i][a.dataset.k]), a.dataset.k === 'risk' ? 'Risk level' : 'Residual risk', c => { LIB[i][a.dataset.k] = c; viewLibrary($('#app')); }); break;
    case 'libundo': LIB = clone(S.cfg.library); viewLibrary($('#app')); break;
    case 'libsave': { const blank = LIB.length; LIB = LIB.filter(libFilled); const dropped = blank - LIB.length;
      const bad = LIB.filter(x => !x.name.trim()); if (bad.length) { viewLibrary($('#app')); toast(`${bad.length} row${bad.length > 1 ? 's have' : ' has'} no activity or hazard name – fill it in or delete the row (✕ on the left).`); const r = $(`[data-li="${LIB.indexOf(bad[0])}"] textarea`); if (r) { r.focus(); r.scrollIntoView({block: 'center'}); } break; } try { await saveCfg('library', LIB); toast(`Library saved${dropped ? ` (${dropped} blank row${dropped > 1 ? 's' : ''} removed)` : ''} – everyone gets it on their next sync.`); viewLibrary($('#app')); } catch (x) {} break; }
    // docs
    case 'docadd': REG.unshift(normReg({type: 'SWP', number: ''})); LS.set('docq', ''); LS.set('docret', '1'); viewDocs($('#app')); $('[data-di="0"] [data-dk=number]').focus(); break;
    case 'docdel': if (await ask('Delete document?', `Remove ${REG[i].code || 'this row'} from the list${REG[i].file ? ' and delete its file' : ''}? Plans that name it will show it without a link. (Setting Status to Retired keeps it for old plans.)`, 'Delete', 1)) { const f = REG[i].file; REG.splice(i, 1); if (await saveRegister('Deleted') && f) { try { await B().removeDoc(f.path); } catch (x) {} } } break;
    case 'docmissing': { const have = new Set(REG.map(r => r.code)); defaultRegister(S.cfg.library, S.cfg.templates).forEach(r => { if (!have.has(r.code)) REG.push(r); }); REG.sort(docSort); viewDocs($('#app')); $('[data-act=docsave]').disabled = false; break; }
    case 'docsave': saveRegister('Saved'); break;
    case 'docret': LS.set('docret', a.checked ? '1' : '0'); viewDocs($('#app')); break;
    case 'docup': { if (!REG[i].number) { toast('Give it a number first.'); break; } const f = $('#docfile'); f.dataset.i = i; f.click(); break; }
    case 'docbulk': $('#docfiles').click(); break;
    case 'docimport': openImport(); break;
    case 'docsoffline': LS.set('docsOffline', a.checked ? '1' : '0'); toast(a.checked ? 'Saving SOPs / SWPs on this device…' : 'Offline copies will be removed.'); syncDocs(); break;
    // templates
    case 'tnew': { const name = await promptText('New template', 'Template name', ''); if (!name) break; const t = {id: 'T' + uid().slice(0, 8), name, rows: []}; TPL.push(t); go('templates', t.id, true); break; }
    case 'tren': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; const name = await promptText('Rename template', 'Template name', cur.name); if (name) { cur.name = name; viewTemplates($('#app')); } break; }
    case 'tdel': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; if (await ask('Delete template?', `Delete “${cur.name}”? (Takes effect when you save.)`, 'Delete', 1)) { TPL = TPL.filter(t => t !== cur); go('templates', TPL[0] && TPL[0].id, true); } break; }
    case 'trowadd': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; cur.rows.push({name: '', task: '', desc: '', resp: 'Employee', risk: '', control: '', residual: ''}); viewTemplates($('#app')); break; }
    case 'trowdel': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; cur.rows.splice(i, 1); viewTemplates($('#app')); break; }
    case 'trisk': { const cur = TPL.find(t => t.id === S.param) || TPL[0]; pickCode(normCode(cur.rows[i][a.dataset.k]), a.dataset.k === 'risk' ? 'Risk level' : 'Residual risk', c => { cur.rows[i][a.dataset.k] = c; viewTemplates($('#app')); }); break; }
    case 'tsave': TPL.forEach(t => { t.rows = t.rows.filter(r => (r.name || '').trim() || (r.task || '').trim() || (r.desc || '').trim() || (r.control || '').trim()); }); try { await saveCfg('templates', TPL); toast('Templates saved'); viewTemplates($('#app')); } catch (x) {} break;
    // emergency
    case 'emadd': EM.communities.push({id: 'C' + uid().slice(0, 8), city: '', prov: 'NS', v: {}}); viewEmergency($('#app')); break;
    case 'emdel': if (await ask('Delete community?', `Delete ${EM.communities[i].city || 'this row'}?`, 'Delete', 1)) { EM.communities.splice(i, 1); viewEmergency($('#app')); $('[data-act=emsave]').disabled = false; } break;
    case 'emsave': try { await saveCfg('emergency', EM); toast('Saved'); viewEmergency($('#app')); } catch (x) {} break;
    case 'txreset': if (await ask('Restore wording?', 'Put back the original wording from the Excel form (with EXP changed to Hive)?', 'Restore')) { try { await saveCfg('texts', {...DEFAULT_TEXTS}); render(); } catch (x) {} } break;
    // staff
    case 'addstaff': staffForm(); break;
    case 'editstaff': staffForm(staffById(a.dataset.id)); break;
    case 'reinvite': { const s = staffById(a.dataset.id); try { const r = await B().adminAction('resend', {id: s.id}); S.mode === 'demo' ? inviteInfo(s) : r && r.mail_error ? manualInvite(s, r) : toast('Invitation sent again to ' + s.email); } catch (x) { toast(x.message); } break; }
    case 'toggleactive': { const s = staffById(a.dataset.id); const on = s.active === false; if (!await ask(on ? 'Reactivate?' : 'Deactivate?', on ? `${s.full_name} will be able to sign in again.` : `${s.full_name} won’t be able to sign in. Their plans stay.`, on ? 'Reactivate' : 'Deactivate', !on)) break; try { await B().adminAction('set_active', {id: s.id, active: on}); s.active = on; if (S.mode === 'demo') await Demo.saveStaff(S.staff); else await Live.pull(); render(); } catch (x) { toast(x.message); } break; }
  }
});
function promptText(title, label, val) { return new Promise(res => { const m = modal(`<h2>${esc(title)}</h2><form id="pt"><label class="f">${esc(label)}<input type="text" id="ptv" value="${esc(val || '')}" required></label><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" data-x>Cancel</button><button class="btn pri">OK</button></div></form>`, 'narrow'); $('#ptv', m).focus(); m.addEventListener('click', e => { if (e.target.closest('[data-x]')) { closeModal(); res(null); } }); $('#pt', m).onsubmit = e => { e.preventDefault(); const v = $('#ptv', m).value.trim(); closeModal(); res(v); }; }); }

const VIEWS = {home: viewHome, list: viewList, plan: viewPlan, library: viewLibrary, docs: viewDocs, templates: viewTemplates, emergency: viewEmergency, admin: viewAdmin, texts: viewTexts, mailing: viewMailing, obslist: viewObsList, hazlist: viewHazList};

/* ---------- demo sample ---------- */
function seedDemoNotes() {
  const lib = n => { const x = S.cfg.library.find(l => l.name === n); return {libId: x.id, name: x.name, desc: x.desc, resp: x.resp, risk: x.risk, control: x.control, residual: x.residual, task: '', due: '', done: ''}; };
  const c = S.cfg.emergency.communities.find(x => x.city === 'Sydney') || S.cfg.emergency.communities[0];
  const base = (id, owner, pm, status, title, no, addr, rows, extra = {}) => { const now = new Date(Date.now() - Math.random() * 6e8).toISOString(); S.notes[id] = Object.assign({id, section: 'safety', kind: 'hazard_assessment', owner, pm, status, title, project_no: no, created_at: now, updated_at: now,
    data: {title, projectNo: no, date: now.slice(0, 10), address: addr, activities: 'Phase I ESA site visit', subActivities: 'None', subOwn: false, subHive: false, community: c.id, emergency: {...c.v}, contacts: {client: 'NSTIR', fieldRep: (staffById(owner) || {}).full_name, safety: '', gc: '', sub: '', subcon: '', other: ''}, rows, violence: false, crew: [], sign1: null, sign2: null, template: ''}}, extra); };
  base('demo-1', 'd-tech', 'd-admin', 'draft', 'Phase I ESA', '26-0142', '60 Main Street, Reserve Mines, NS', ['Working Alone', 'Traffic', 'Mobile Equipment', 'Ticks', 'Hazardous Materials'].map(lib));
  base('demo-2', 'd-tech2', 'd-admin', 'submitted', 'Geotechnical investigation – Kings Road', '26-0131', '480 Kings Road, Sydney River, NS', ['Test Pit Investigation', 'Underground Utility Locates', 'Traffic', 'Drilling Boreholes'].map(lib), {submitted_at: new Date(Date.now() - 864e5).toISOString()});
  S.notes['demo-2'].data.sign1 = S.notes['demo-2'].data.sign2 = {name: 'Amélie Boudreau', sig: null, at: new Date(Date.now() - 864e5).toISOString()};
  saveNotes();
}

/* ---------- start ---------- */
async function start() {
  addEventListener('online', () => { S.online = true; topbar(); sync(); });
  addEventListener('offline', () => { S.online = false; topbar(); });
  if (/type=(invite|recovery)/.test(location.hash)) S.needPassword = true;
  { const h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1)); if (h.get('error_code') || h.get('error')) { LINK_ERR = (h.get('error_description') || h.get('error_code') || h.get('error')).replace(/\+/g, ' ').replace(/\.$/, '').toLowerCase(); try { sessionStorage.setItem('hn-linkerr', LINK_ERR); } catch (e) {} history.replaceState(null, '', location.pathname); }
    else { try { LINK_ERR = sessionStorage.getItem('hn-linkerr') || ''; sessionStorage.removeItem('hn-linkerr'); } catch (e) {} } }
  await DB.open();
  try { const r = await fetch('logo.png', {cache: 'no-cache'}); if (r.ok && (r.headers.get('content-type') || '').startsWith('image')) { const b = await r.blob(); LOGO_IMG = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); }); } } catch (e) {}
  try { const r = await fetch('hivenotes-config.json', {cache: 'no-cache'}); if (r.ok) S.conf = await r.json(); else S.conf = JSON.parse(LS.get('conf') || '{}'); if (r.ok) LS.set('conf', JSON.stringify(S.conf)); } catch (e) { try { S.conf = JSON.parse(LS.get('conf') || '{}'); } catch (x) { S.conf = {}; } }
  S.mode = S.conf.supabaseUrl && S.conf.supabaseKey ? 'live' : 'demo';
  S.lastSync = LS.get('lastSync');
  try { await B().init(); S.me = await B().restore(); } catch (e) { console.warn(e); S.me = null; }
  if (S.mode === 'demo' && !LS.get('demoUser')) S.me = null;
  if (S.me) await afterLogin(); else render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.__noSW) {
    try { const hadSW = !!navigator.serviceWorker.controller; const reg = await navigator.serviceWorker.register('sw.js'); navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !window.__reloading) { window.__reloading = true; location.reload(); } }); reg.update(); } catch (e) {}
  }
  setInterval(() => { if (S.online && S.mode === 'live' && S.me) sync(); }, 5 * 60 * 1000);
}
start();
}
